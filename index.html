<html lang="ru">

    <title>Селекторы</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="content">
        <h1 class="title">Проверяем селекторы</h1>

          <h2>Первый материал</h2>
          <p>Обычный абзац.</p>

          <a href="#">Читать</a>

        <article class="card card--featured">
          <h2>Избранный материал</h2>
          <p>Этот блок имеет дополнительный класс.</p>
          <a href="#">Читать</a>
        </article>
        
          <form class="filter">
            <label for="search-input">Поиск</label>
            <input type="text" id="search-input" name="search" required />
            <label><input type="checkbox" name="only" /> Только избранное</label>          
        </form>
      </section>
    </main>
